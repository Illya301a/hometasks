<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="ie=edge" http-equiv="X-UA-Compatible">
  <title>Document</title>
</head>

<body>
  <div class="container">
    <h1 class="main-title">Проект навчання Webpack</h1>
    <div class="content">
      <div class="post-section">
        <h2>Інформація про пост</h2>
        <div id="post-output"></div>
      </div>

      <div class="statistics-section">
        <h2>Статистика</h2>
        <p>Клікніть будь-де, щоб збільшити лічильник</p>
        <div id="click-counter">Кліків: 0</div>
        <button id="destroy-stats">Знищити статистику</button>
      </div>

      <div class="data-section">
        <h2>Відображення даних</h2>
        <div id="json-data"></div>
        <div id="csv-data"></div>
        <div id="xml-data"></div>
      </div>

      <div class="image-section">
        <h2>Зображення</h2>
        <img src="./assets/icon-square-big.png" alt="Приклад зображення" class="sample-image">
      </div>
    </div>
  </div>
</body>

</html>
